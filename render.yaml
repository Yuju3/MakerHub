# render.yaml — Blueprint for deploying MakerHub on Render.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. On Render → New → Blueprint → connect the repo.
#   3. Render reads this file and creates both services.
#   4. Fill in MONGODB_URI in the Render dashboard (Env tab).
#
# Docs: https://docs.render.com/infrastructure-as-code

services:
  # ── Flask backend ──────────────────────────────────────────────
  - type: web
    name: makerhub-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGODB_URI
        sync: false              # you paste this manually in the dashboard
      - key: MONGODB_DB
        value: makerhub
      - key: FRONTEND_ORIGIN
        value: https://makerhub.onrender.com
      - key: PYTHON_VERSION
        value: "3.12"

  # ── React frontend (static site) ──────────────────────────────
  - type: web
    name: makerhub
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # React Router handles all routes; send everything to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://makerhub-api.onrender.com
